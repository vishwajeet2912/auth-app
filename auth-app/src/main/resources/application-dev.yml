server:
  port: 9092

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_app
    username: root
    password: Jeet@3558
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    org.hibernate.SQL: debug
#    org.springframework.security: DEBUG


# ✅ JWT CONFIG (TOP LEVEL — NOT inside logging)
security:
  jwt:
    secret: ${JWT_SECRET:mysupersecurejwtsecretkeymysupersecurejwtsecretkey1234567890abcd}
    issuer: ${JWT_ISSUER:api.substring.com}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}